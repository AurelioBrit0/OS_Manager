<!-- Container do formulário de cadastro -->
<div class="cadastro-container w-full">
  <!-- Formulário reativo: [formGroup] vincula ao FormGroup do componente -->
  <form [formGroup]="formOS" (ngSubmit)="onSubmit()" class="w-full">

    <!-- Linha 1: Título e Status -->
    <div class="row">
      <div class="col-6" style="margin-bottom: 10px;">
        <label for="titulo">Título</label>
        <input pInputText id="titulo" formControlName="titulo" 
          placeholder="Ex: Manutenção de servidor" class="form-control" [style]="{ width: '100%' }" />
      </div>
      </div>
      <div class="row">
      <div class="col-6" style="margin-bottom: 10px;">
        <label for="status">Status</label>
        <select id="status" class="form-select" formControlName="status" style="width: 100%;">
        <option [value]="'NOVO'">Novo</option>
        <option [value]="'EM_ANDAMENTO'">Em andamento</option>
        <option [value]="'FINALIZADO'">Finalizado</option>
        <option [value]="'CANCELADO'">Cancelado</option>
        </select>
      </div>
    </div>

    <!-- Linha 2: Descrição (full width) -->
    <div class="field col-12" style="margin-bottom: 10px;">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" formControlName="descricao" 
        placeholder="Descreva os detalhes da OS" rows="8" [style]="{ width: '100%' }" class="form-control"></textarea>
    </div>

    <!-- Linha 3: Comentário (full width) -->
    <div class="field col-12" style="margin-bottom: 10px;">
      <label for="comentario">Comentário</label>
      <textarea id="comentario" formControlName="comentario" 
        placeholder="Adicione comentários adicionais" rows="4" [style]="{ width: '100%' }" class="form-control"></textarea>
    </div>

    <!-- Linha 4: Datas de abertura e fechamento -->
    <div class="row">
      <div class="col-6" style="margin-bottom: 10px;">
        <label for="dataAbertura">Data de Abertura</label>
        <input type="date" id="dataAbertura" class="form-control" formControlName="dataAbertura" [style]="{ width: '100%' }" />
      </div>
      <div class="col-6" style="margin-bottom: 10px;">
        <label for="dataFechamento">Data de Fechamento</label>
        <input type="date" id="dataFechamento" class="form-control" formControlName="dataFechamento" [style]="{ width: '100%' }" />
      </div>
    </div>

    <!-- Linha 5: IDs e Valor -->
    <div class="row">
      <!-- <div class="col-4" style="margin-bottom: 10px;">
        <label for="pessoa_id">Pessoa ID</label>
        <input type="number" id="pessoa_id" class="form-control" formControlName="pessoa_id" 
          placeholder="ID da pessoa" [style]="{ width: '100%' }" />
      </div>
      <div class="col-4" style="margin-bottom: 10px;">
        <label for="produto_id">Produto ID</label>
        <input type="number" id="produto_id" class="form-control" formControlName="produto_id" 
          placeholder="ID do produto" [style]="{ width: '100%' }" />
      </div> -->
      <div class="col-4" style="margin-bottom: 10px;">
        <label for="valor">Valor</label>
        <p-inputNumber id="valor" formControlName="valor" mode="currency" currency="BRL" 
          locale="pt-BR" [style]="{ width: '100%' }"></p-inputNumber>
      </div>
    </div>

    <!-- Botões de ação -->
    <div style="margin-top: 20px;">
      <!-- Botão Salvar: desabilitado se formulário é inválido -->
      <p-button label="Salvar" type="submit" [disabled]="formOS.invalid" class="btn-save">
      </p-button>
      
      <!-- Botão Cancelar: emite evento para fechar o modal -->
      <button pButton type="button" label="Cancelar" 
        class="p-button-secondary" (click)="fecharModal.emit()" 
        style="margin-left: 10px;"></button>
    </div>

  </form>
</div>
